# Demo stack: uses the older docker-compose.yml file name on purpose.
# demo.sh stops "alerts" after starting it, so the stack shows as partial.
services:
  status-page:
    image: busybox:1.36
    command: httpd -f -p 8081
    ports:
      - "18081:8081"
    restart: unless-stopped
  alerts:
    image: busybox:1.36
    command: sh -c 'while true; do sleep 3600; done'
    restart: unless-stopped
