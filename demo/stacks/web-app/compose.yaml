# Demo stack: services on a private network, one with a published port and a
# healthcheck, a sidecar sharing the frontend's network, and a one-shot job
services:
  frontend:
    image: busybox:1.36
    command: sh -c 'echo ok > /tmp/index.html && httpd -f -p 8080 -h /tmp'
    ports:
      - "18080:8080"
    networks: [app-net]
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 5s
    restart: unless-stopped
  worker:
    image: busybox:1.36
    command: sh -c 'while true; do sleep 3600; done'
    networks: [app-net]
    volumes:
      - cache:/cache
      - uploads:/uploads
    restart: unless-stopped
  sidecar:
    image: busybox:1.36
    command: sh -c 'while true; do sleep 3600; done'
    network_mode: "service:frontend"
    restart: unless-stopped
  migrate:
    image: busybox:1.36
    command: echo "migrations applied"
    networks: [app-net]
    restart: "no"

networks:
  app-net:

volumes:
  cache:
  uploads:
