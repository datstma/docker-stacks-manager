name: Release

# Push a tag like v1.2.3 (matching the version in docker-stacks-manager.sh and
# docker-stacks-manager.ps1) to publish a GitHub release. `dsm --update`,
# `dsm -Update`, install.sh and install.ps1 install the latest one.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches both editions' version
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' docker-stacks-manager.sh)
          ps_version=$(sed -n "s/^\$script:DsmVersion = '\(.*\)'.*/\1/p" docker-stacks-manager.ps1)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$ps_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$version / DsmVersion=$ps_version"
            exit 1
          fi

      - name: Test suite
        run: ./tests/run.sh

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            docker-stacks-manager.sh install.sh docker-stacks-manager.ps1 install.ps1
