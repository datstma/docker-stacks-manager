name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install bash 4+ (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Test suite
        run: ./tests/run.sh

      - name: Installer round trip
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/dsm"
          "$RUNNER_TEMP/dsm/bin/dsm" --version
          "$RUNNER_TEMP/dsm/bin/dsm" --help > /dev/null
          ./install.sh --prefix "$RUNNER_TEMP/dsm" --uninstall
          test ! -e "$RUNNER_TEMP/dsm/bin/dsm"

  powershell:
    name: PowerShell ${{ matrix.edition }} (Windows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: '7'
            shell: pwsh
          - edition: '5.1'
            shell: powershell
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -MinimumVersion 5.5 -MaximumVersion 5.99 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester tests
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/powershell'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          # Failures as annotations, readable on the run page without opening the log
          foreach ($t in $result.Failed) {
            $msg = ($t.ErrorRecord | Select-Object -First 1).Exception.Message -replace '\r?\n', ' '
            Write-Output "::error title=$($t.ExpandedPath)::$msg"
          }
          foreach ($c in $result.Containers | Where-Object Result -eq 'Failed') {
            foreach ($e in $c.ErrorRecord) { Write-Output "::error title=Pester container $($c.Item)::$($e.Exception.Message -replace '\r?\n', ' ')" }
          }
          if ($result.Result -ne 'Passed') { exit 1 }

      - name: Installer round trip
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'dsm'
          ./install.ps1 -Destination $dest
          & "$dest\dsm.cmd" -Version
          if ($LASTEXITCODE -ne 0) { throw "dsm.cmd -Version failed" }
          ./install.ps1 -Destination $dest -Uninstall
          if (Test-Path $dest) { throw "uninstall left $dest behind" }

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (errors only)
        run: make lint

  powershell-lint:
    name: PowerShell lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $files = 'docker-stacks-manager.ps1', 'install.ps1', 'demo/demo.ps1', 'tests/powershell/record.ps1', 'tests/powershell/bin/docker.ps1'
          $found = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $found | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($found) { throw "PSScriptAnalyzer: $(@($found).Count) finding(s)" }

      - name: PowerShell encodings (BOM where 5.1 needs it, none in install.ps1)
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads BOM-less files as ANSI, so any file with
          # non-ASCII text needs a UTF-8 BOM. install.ps1 runs through irm | iex,
          # where 5.1 mis-decodes a BOM: it must be plain ASCII without one.
          $problems = foreach ($f in Get-ChildItem -Recurse -Include *.ps1, *.psd1) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $bom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $ascii = -not ($b | Where-Object { $_ -gt 127 })
            if ($f.Name -eq 'install.ps1') { if (-not $ascii) { "$($f.FullName): must be plain ASCII without a BOM" } }
            elseif (-not $bom -and -not $ascii) { "$($f.FullName): needs a UTF-8 BOM" }
          }
          if ($problems) { $problems; throw 'Encoding problems' }

      - name: Both editions and the changelog agree on the version
        shell: bash
        run: |
          sh_version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' docker-stacks-manager.sh)
          ps_version=$(sed -n "s/^\$script:DsmVersion = '\(.*\)'.*/\1/p" docker-stacks-manager.ps1)
          echo "bash: $sh_version  powershell: $ps_version"
          [ "$sh_version" = "$ps_version" ] || { echo "::error::Versions differ: bash $sh_version, PowerShell $ps_version"; exit 1; }
          grep -q "^## \[$sh_version\]" CHANGELOG.md ||
            { echo "::error::VERSION $sh_version has no entry in CHANGELOG.md"; exit 1; }
